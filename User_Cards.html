<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wireframe Sabiduría</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: Arial, sans-serif;
    }

    body {
        background: #ffffff;
        display: flex;
        justify-content: center;
        padding: 20px;
    }

    .card {
        width: 420px;
        background: #f3f3f3;
        border: 2px solid #999;
        padding: 30px 25px;
    }

    .title {
        text-align: center;
        font-size: 3rem;
        margin-bottom: 25px;
    }

    .symbol {
        position: relative;
        width: 220px;
        height: 140px;
        margin: 0 auto 25px;
    }

    .circle {
        position: absolute;
        left: 0;
        top: 10px;
        width: 130px;
        height: 130px;
        border: 6px solid #9b9b9b;
        border-radius: 50%;
        background: transparent;
        z-index: 2;
    }

    .rectangle {
        position: absolute;
        left: 105px;
        top: 30px;
        width: 110px;
        height: 85px;
        border: 4px solid #9b9b9b;
        background: transparent;
    }

    hr {
        border: none;
        border-top: 2px solid #aaa;
        margin: 20px 0;
    }

    .skill {
        display: flex;
        align-items: center;
        margin: 18px 0;
        font-size: 1.2rem;
    }

    .skill input {
        margin-right: 10px;
        width: 20px;
        height: 20px;
    }

    .line {
        width: 45px;
        border-bottom: 2px solid #999;
        margin-right: 8px;
    }

    .add {
        display: flex;
        align-items: center;
        margin-top: 20px;
        font-size: 1.2rem;
    }

    .add input {
        margin-right: 10px;
        width: 20px;
        height: 20px;
    }
</style>
</head>
<body>

<div class="card">
    <h1 class="title">SABIDURÍA</h1>

    <div class="symbol">
        <div class="circle"></div>
        <div class="rectangle"></div>
    </div>

    <hr>

    <label class="skill">
        <input type="radio" name="habilidad">
        <span class="line"></span>
        Adaptabilidad
    </label>

    <label class="skill">
        <input type="radio" name="habilidad">
        <span class="line"></span>
        Seriedad
    </label>

    <label class="skill">
        <input type="radio" name="habilidad">
        <span class="line"></span>
        Lealtad
    </label>

    <label class="add">
        <input type="radio" name="habilidad">
        <span class="line"></span>
        (+) Añadir Habilidad
    </label>
</div>

</body>
</html>
